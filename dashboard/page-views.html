<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fantasy Coach — weekly page views</title>
<style>
  :root {
    /* Same palette as dashboard/index.html, so this reads as part of the
       same tooling rather than a separate app. */
    --fc-blue: #3d9be9;
    --fc-blue-light: #63b0ee;
    --bg: #ffffff;
    --card: #ffffff;
    --ink: #1c1917;
    --muted: #6b6560;
    --border: #e7e5e4;
    --accent: var(--fc-blue);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 0 1.5rem 1.5rem;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    line-height: 1.4;
  }
  .site-banner {
    background: linear-gradient(180deg, var(--fc-blue-light) 0%, var(--fc-blue) 100%);
    color: #ffffff;
    margin: 0 -1.5rem 1.5rem;
    padding: 1.25rem 1.5rem 1rem;
    text-align: center;
  }
  .site-title { font-size: 1.5rem; font-weight: 800; margin: 0; }
  h1 { font-size: 1.35rem; margin: 0 0 0.25rem; }
  .subtitle { color: var(--muted); font-size: 0.9rem; margin: 0 0 1.5rem; }
  .as-of {
    display: inline-block;
    font-size: 0.8rem;
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 0.15rem 0.7rem;
    margin-bottom: 1.5rem;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 1rem;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.25rem;
  }
  .card h2 { font-size: 1rem; margin: 0 0 0.75rem; text-transform: capitalize; }
  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  th, td { text-align: left; padding: 0.3rem 0.4rem; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; }
  td.views { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
  .empty-note {
    font-size: 0.85rem;
    color: var(--muted);
  }
  .error-state {
    background: var(--card);
    border: 1px solid #b91c1c;
    color: #b91c1c;
    border-radius: 12px;
    padding: 1rem;
  }
</style>
</head>
<body>
<header class="site-banner">
  <p class="site-title">Fantasy Coach</p>
</header>

  <h1>Weekly page views</h1>
  <p class="subtitle">First-party, server-side view counts per sibling site — accurate where a consent-gated analytics tag can't be. One table per project, most recent week first.</p>
  <span class="as-of" id="as-of">data as of — loading…</span>

  <div id="projects" class="grid" aria-live="polite">
    <div class="card"><p>Loading…</p></div>
  </div>

<script>
(function () {
  var METRICS_URL = 'https://dmytkubjxwwwkroutvdu.supabase.co/functions/v1/page-view-metrics';

  function fmtDate(iso) {
    try { return new Date(iso).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' }); }
    catch (e) { return iso; }
  }

  function groupByProject(weekly) {
    var byProject = {};
    weekly.forEach(function (row) {
      if (!byProject[row.project]) byProject[row.project] = [];
      byProject[row.project].push(row);
    });
    return byProject;
  }

  function renderProjectCard(project, weeks) {
    var sorted = weeks.slice().sort(function (a, b) { return b.week_start.localeCompare(a.week_start); });
    var rows = sorted.map(function (w) {
      return '<tr><td>' + w.week_start + '</td><td class="views">' + w.views + '</td></tr>';
    }).join('');
    return '<div class="card">' +
      '<h2>' + project + '</h2>' +
      '<table><thead><tr><th>Week of</th><th>Views</th></tr></thead><tbody>' + rows + '</tbody></table>' +
      '</div>';
  }

  fetch(METRICS_URL, { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function (data) {
      document.getElementById('as-of').textContent = 'data as of ' + fmtDate(data.generated_at);
      var byProject = groupByProject(data.weekly);
      var projects = Object.keys(byProject).sort();
      if (projects.length === 0) {
        document.getElementById('projects').innerHTML = '<div class="card"><p class="empty-note">No page views recorded yet.</p></div>';
        return;
      }
      document.getElementById('projects').innerHTML = projects
        .map(function (p) { return renderProjectCard(p, byProject[p]); })
        .join('');
    })
    .catch(function (err) {
      document.getElementById('as-of').textContent = 'data as of — unavailable';
      document.getElementById('projects').innerHTML =
        '<div class="error-state">Could not load page views (' + err.message + ').</div>';
    });
})();
</script>
</body>
</html>
