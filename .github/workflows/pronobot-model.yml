name: PronoBot predictions

# Runs 🤖PronoBot, the automated player that predicts with a Dixon-Coles
# goals model + expected-points picker (scripts/pronobot/predict_model.py).
# Same public API, no DB access, no secrets: training data is
# football-data.co.uk's free CSVs. The earlier Jev-based bot used the same
# pseudo; its workflow was retired.
#
# Hourly at :20. Idempotent per game (acts only on games with no
# `my_prediction` for this pseudo).

on:
  schedule:
    - cron: '20 * * * *'
  workflow_dispatch: {}

env:
  PRONOS_API_BASE: https://dmytkubjxwwwkroutvdu.supabase.co/functions/v1/api

jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/pronobot/requirements-model.txt

      - name: Install dependencies
        run: pip install --disable-pip-version-check -r scripts/pronobot/requirements-model.txt

      - name: Predict this gameweek's matches
        working-directory: scripts/pronobot
        run: python3 predict_model.py
