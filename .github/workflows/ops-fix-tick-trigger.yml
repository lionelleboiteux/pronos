name: Ops - Diagnose gameweek tick trigger history

# Follow-up to the first run of this workflow: that run found tick_token
# already present and gw2 already scored for 4/5 leagues *before* it did
# anything, which contradicts the hypothesis that the vault secret was
# missing. This run pulls the actual timeline (net._http_response status
# code history, and occurred_at on the telemetry events for gw2) to find
# out when the tick job actually started succeeding and when gw2 was
# actually scored, instead of guessing from a single recent snapshot.

on:
  workflow_dispatch: {}

env:
  SUPABASE_PROJECT_REF: dmytkubjxwwwkroutvdu

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: L1 current_gameweek_id and gw3 existence
        if: always()
        run: |
          supabase db query --linked --agent=no -o json "
            select
              l.code, l.current_gameweek_id,
              (select number from gameweeks where id = l.current_gameweek_id) as current_gw_number,
              (select jsonb_agg(jsonb_build_object(
                  'gameweek_id', g.id, 'number', g.number, 'starts_at', g.starts_at,
                  'games_total', (select count(*) from games gm where gm.gameweek_id = g.id),
                  'games_scheduled', (select count(*) from games gm where gm.gameweek_id = g.id and gm.status='scheduled'),
                  'games_finished', (select count(*) from games gm where gm.gameweek_id = g.id and gm.status='finished')
                ) order by g.number) from gameweeks g where g.league_id = l.id and g.number in (2,3)) as gw2_and_gw3
            from leagues l where l.code = 'L1';
          "
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Tick call history (status code timeline)
        run: |
          supabase db query --linked --agent=no -o json "
            select status_code, count(*) as n, min(created) as first_seen, max(created) as last_seen
            from net._http_response
            group by status_code
            order by last_seen desc;
          "
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: gw2 telemetry event timeline per league
        if: always()
        run: |
          supabase db query --linked --agent=no -o json "
            select l.code as league_code, g.id as gameweek_id, g.starts_at,
              (select count(*) from telemetry_events te where te.event_type='gameweek_closed' and te.gameweek_id=g.id) as closed_count,
              (select min(occurred_at) from telemetry_events te where te.event_type='gameweek_closed' and te.gameweek_id=g.id) as first_closed_at,
              (select max(occurred_at) from telemetry_events te where te.event_type='gameweek_closed' and te.gameweek_id=g.id) as last_closed_at,
              (select count(*) from telemetry_events te where te.event_type='scoring_run_completed' and te.gameweek_id=g.id) as scored_count,
              (select min(occurred_at) from telemetry_events te where te.event_type='scoring_run_completed' and te.gameweek_id=g.id) as first_scored_at,
              (select max(occurred_at) from telemetry_events te where te.event_type='scoring_run_completed' and te.gameweek_id=g.id) as last_scored_at
            from gameweeks g join leagues l on l.id = g.league_id
            where g.number = 2
            order by l.code;
          "
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: admin_manual_intervention events on gw2 (were these manually rescored?)
        if: always()
        run: |
          supabase db query --linked --agent=no -o json "
            select l.code as league_code, te.occurred_at, te.payload
            from telemetry_events te
            join gameweeks g on g.id = te.gameweek_id
            join leagues l on l.id = g.league_id
            where g.number = 2 and te.event_type = 'admin_manual_intervention'
            order by te.occurred_at;
          "
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: vault secret creation time
        if: always()
        run: |
          supabase db query --linked --agent=no -o json "
            select name, created_at, updated_at from vault.secrets where name = 'tick_token';
          "
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: cron job run history (last 20)
        if: always()
        run: |
          supabase db query --linked --agent=no -o json "
            select jrd.status, jrd.return_message, jrd.start_time, jrd.end_time
            from cron.job_run_details jrd
            join cron.job j on j.jobid = jrd.jobid
            where j.jobname = 'gameweek-transition-tick'
            order by jrd.start_time desc
            limit 20;
          "
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
