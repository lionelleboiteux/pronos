name: Ops - Diagnose gameweek tick trigger history

# Follow-up to the first run of this workflow: that run found tick_token
# already present and gw2 already scored for 4/5 leagues *before* it did
# anything, which contradicts the hypothesis that the vault secret was
# missing. This run pulls the actual timeline (net._http_response status
# code history, and occurred_at on the telemetry events for gw2) to find
# out when the tick job actually started succeeding and when gw2 was
# actually scored, instead of guessing from a single recent snapshot.

on:
  workflow_dispatch: {}

env:
  SUPABASE_PROJECT_REF: dmytkubjxwwwkroutvdu

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Tick call history (status code timeline)
        run: |
          supabase db query --linked --agent=no -o json "
            select status_code, count(*) as n, min(created) as first_seen, max(created) as last_seen
            from net._http_response
            group by status_code
            order by last_seen desc;
          "
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: gw2 telemetry event timeline per league
        run: |
          supabase db query --linked --agent=no -o json "
            select l.code as league_code, g.id as gameweek_id, g.starts_at,
              (select occurred_at from telemetry_events te where te.event_type='gameweek_closed' and te.gameweek_id=g.id) as closed_at,
              (select occurred_at from telemetry_events te where te.event_type='scoring_run_completed' and te.gameweek_id=g.id) as scored_at
            from gameweeks g join leagues l on l.id = g.league_id
            where g.number = 2
            order by l.code;
          "
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: vault secret creation time
        run: |
          supabase db query --linked --agent=no -o json "
            select name, created_at, updated_at from vault.secrets where name = 'tick_token';
          "
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: cron job run history (last 20)
        run: |
          supabase db query --linked --agent=no -o json "
            select jrd.status, jrd.return_message, jrd.start_time, jrd.end_time
            from cron.job_run_details jrd
            join cron.job j on j.jobid = jrd.jobid
            where j.jobname = 'gameweek-transition-tick'
            order by jrd.start_time desc
            limit 20;
          "
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
